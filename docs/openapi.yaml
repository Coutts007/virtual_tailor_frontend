openapi: 3.1.0
info:
  title: Virtual Tailor API
  version: 1.0.0-draft
  description: |
    Contract between the Virtual Tailor PWA and the FastAPI backend.
    Human-readable version: docs/api-contract.md. Lengths are integer millimetres;
    timestamps are ISO 8601 UTC. Errors are RFC 9457 application/problem+json.
servers:
  - url: /api/v1
tags:
  - name: public
  - name: client-app
  - name: auth
  - name: clients
  - name: profiles
  - name: orders
  - name: sheets
  - name: audit
  - name: admin
  - name: study

security:
  - bearerAuth: []

paths:
  /settings/public:
    get:
      tags: [public]
      operationId: getPublicSettings
      security: []
      responses:
        '200':
          description: Feature switches
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicSettings' }

  /client-codes/{code}:
    get:
      tags: [client-app]
      operationId: checkClientCode
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ClientCode' }
      responses:
        '200':
          description: Code exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientCodeCheck' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /profiles:
    post:
      tags: [client-app]
      operationId: syncProfile
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Equals profile_id.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeasurementProfilePayload' }
      responses:
        '201':
          description: Stored (or identical repeat)
          content:
            application/json:
              schema:
                type: object
                required: [profile_id, version]
                properties:
                  profile_id: { type: string, format: uuid }
                  version: { type: integer, minimum: 1 }
        '404':
          description: code_not_found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: profile_version_conflict (includes server_version)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: Body too large (over 200 KB)
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /profiles/{id}:
    get:
      tags: [profiles]
      operationId: getProfile
      description: Server writes a profile_view audit entry. Forbidden for role measurer.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Full profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeasurementProfile' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /deletion-requests:
    post:
      tags: [client-app]
      operationId: requestDeletion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_code, profile_ids, reason]
              properties:
                client_code: { $ref: '#/components/schemas/ClientCode' }
                profile_ids:
                  type: array
                  items: { type: string, format: uuid }
                reason: { type: string, enum: [delete, withdraw_consent] }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [request_id]
                properties:
                  request_id: { type: string, format: uuid }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: Registered, awaiting approval
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: pending }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: invalid_credentials
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: account_pending or account_disabled
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        '204': { description: Signed out }

  /me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        '200':
          description: Own account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [auth]
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MePatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '422': { $ref: '#/components/responses/Problem' }

  /me/password:
    post:
      tags: [auth]
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10 }
      responses:
        '204': { description: Changed }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /clients:
    get:
      tags: [clients]
      operationId: listClients
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [last_capture, code, name], default: last_capture }
        - name: filter
          in: query
          schema: { type: string, enum: [new, flags, none] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of clients
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ClientSummary' }
    post:
      tags: [clients]
      operationId: issueClientCode
      description: Audit code_issue.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueCodeInput' }
      responses:
        '201':
          description: Code issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueCodeResponse' }
        '422': { $ref: '#/components/responses/Problem' }

  /clients/{id}:
    get:
      tags: [clients]
      operationId: getClient
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Client detail with profiles and orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [clients]
      operationId: updateClient
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: [string, 'null'] }
                height_mm: { type: [integer, 'null'], minimum: 1200, maximum: 2200 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [clients]
      operationId: deleteClient
      description: Audit deletion. Blocked while orders reference the client's profiles.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Deleted }
        '409':
          description: client_has_orders
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /clients/{id}/rotate-code:
    post:
      tags: [clients]
      operationId: rotateClientCode
      description: Old code stops working. Audit code_issue.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: New code
          content:
            application/json:
              schema:
                type: object
                required: [client_code]
                properties:
                  client_code: { $ref: '#/components/schemas/ClientCode' }
        '404': { $ref: '#/components/responses/Problem' }

  /clients/{id}/profiles:
    get:
      tags: [profiles]
      operationId: listClientProfiles
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Profiles, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProfileSummary' }
        '404': { $ref: '#/components/responses/Problem' }

  /conflicts:
    get:
      tags: [profiles]
      operationId: listConflicts
      responses:
        '200':
          description: Unresolved conflicts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConflictPair' }

  /conflicts/{profile_id}/resolve:
    post:
      tags: [profiles]
      operationId: resolveConflict
      description: Audit override.
      parameters:
        - name: profile_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keep]
              properties:
                keep: { type: string, enum: [newer, server] }
      responses:
        '204': { description: Resolved }
        '404': { $ref: '#/components/responses/Problem' }

  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      parameters:
        - name: status
          in: query
          description: Repeatable. Omitted means every status except collected.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/OrderStatus' }
        - name: sort
          in: query
          schema: { type: string, enum: [due, created], default: due }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of orders plus counts per status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items, counts]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/OrderSummary' }
                      counts:
                        type: object
                        description: Orders per status, ignoring the status filter.
                        propertyNames: { $ref: '#/components/schemas/OrderStatus' }
                        additionalProperties: { type: integer, minimum: 0 }
    post:
      tags: [orders]
      operationId: createOrder
      description: Audit override for each overridden item.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreateInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '422':
          description: validation_failed, due_date_past or ease_out_of_range
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /orders/{id}:
    get:
      tags: [orders]
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [orders]
      operationId: updateOrder
      description: Audit status_change on status changes; override on body value changes.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [orders]
      operationId: deleteOrder
      description: Only while status is new [CONFIRM]. Audit deletion.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Problem' }

  /orders/{id}/sheets:
    post:
      tags: [sheets]
      operationId: generateSheet
      description: Server renders PNG and PDF (Figure 5.6). Audit export.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [include_name]
              properties:
                include_name: { type: boolean, default: false }
      responses:
        '201':
          description: Generated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SheetResponse' }
        '404': { $ref: '#/components/responses/Problem' }

  /sheets/{id}/shares:
    post:
      tags: [sheets]
      operationId: logShare
      description: Audit share.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [via]
              properties:
                via: { $ref: '#/components/schemas/ShareVia' }
      responses:
        '204': { description: Logged }
        '404': { $ref: '#/components/responses/Problem' }

  /audit:
    get:
      tags: [audit]
      operationId: listAudit
      description: Tailors see only their own entries (user and role filters ignored).
      parameters:
        - $ref: '#/components/parameters/AuditUser'
        - $ref: '#/components/parameters/AuditRole'
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/AuditEntityType'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of audit entries, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AuditEntry' }

  /admin/audit.csv:
    get:
      tags: [audit, admin]
      operationId: exportAuditCsv
      description: Admin only. Audit export.
      parameters:
        - $ref: '#/components/parameters/AuditUser'
        - $ref: '#/components/parameters/AuditRole'
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/AuditEntityType'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200': { $ref: '#/components/responses/Csv' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/accounts:
    get:
      tags: [admin]
      operationId: listAccounts
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AccountStatus' }
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }

  /admin/accounts/{id}/approve:
    post:
      tags: [admin]
      operationId: approveAccount
      description: Audit approve.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/AccountResult' }
        '404': { $ref: '#/components/responses/Problem' }

  /admin/accounts/{id}/reject:
    post:
      tags: [admin]
      operationId: rejectAccount
      description: Audit approve (summary "rejected").
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200': { $ref: '#/components/responses/AccountResult' }
        '404': { $ref: '#/components/responses/Problem' }

  /admin/accounts/{id}/disable:
    post:
      tags: [admin]
      operationId: disableAccount
      description: Revokes tokens. Audit settings_change.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/AccountResult' }
        '404': { $ref: '#/components/responses/Problem' }

  /admin/accounts/{id}/enable:
    post:
      tags: [admin]
      operationId: enableAccount
      description: Audit settings_change.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/AccountResult' }
        '404': { $ref: '#/components/responses/Problem' }

  /admin/measurers:
    post:
      tags: [admin, study]
      operationId: createMeasurer
      description: Audit settings_change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeasurerInput' }
      responses:
        '201':
          description: Measurer account created (active)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '422': { $ref: '#/components/responses/Problem' }

  /admin/settings:
    get:
      tags: [admin]
      operationId: getAdminSettings
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
    put:
      tags: [admin]
      operationId: putAdminSettings
      description: Audit settings_change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSettings' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
        '422': { $ref: '#/components/responses/Problem' }

  /admin/deletion-requests:
    get:
      tags: [admin]
      operationId: listDeletionRequests
      responses:
        '200':
          description: Client deletion requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeletionRequest' }

  /study/participants:
    get:
      tags: [study]
      operationId: listParticipants
      description: Admin only. 404 study_mode_off when study mode is off.
      responses:
        '200':
          description: Participants with completeness
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Participant' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [study]
      operationId: enrolParticipant
      description: Creates a linked client code. Audit code_issue.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParticipantInput' }
      responses:
        '201':
          description: Enrolled
          content:
            application/json:
              schema:
                type: object
                required: [participant_id, client_code]
                properties:
                  participant_id: { type: string, format: uuid }
                  client_code: { $ref: '#/components/schemas/ClientCode' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /study/reference-readings:
    post:
      tags: [study]
      operationId: submitReferenceReading
      description: Measurer only. Measurer identified by token. Locked once saved. Never returns system values.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferenceReadingInput' }
      responses:
        '201':
          description: Saved and locked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceReadingResult' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: reading_locked
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /study/export/captures.csv:
    get:
      tags: [study]
      operationId: exportStudyCapturesCsv
      description: Admin only. Appendix E columns (see api-contract.md 2.8). Audit export.
      responses:
        '200': { $ref: '#/components/responses/Csv' }
        '404': { $ref: '#/components/responses/Problem' }

  /study/export/reference.csv:
    get:
      tags: [study]
      operationId: exportStudyReferenceCsv
      description: Admin only. Audit export.
      responses:
        '200': { $ref: '#/components/responses/Csv' }
        '404': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 24-hour expiry. 401 token_expired after expiry.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    AuditUser:
      name: user
      in: query
      description: User email (admin only).
      schema: { type: string }
    AuditRole:
      name: role
      in: query
      schema: { $ref: '#/components/schemas/Role' }
    AuditAction:
      name: action
      in: query
      schema: { $ref: '#/components/schemas/AuditAction' }
    AuditEntityType:
      name: entity_type
      in: query
      schema: { type: string }
    From:
      name: from
      in: query
      description: Inclusive, Nairobi date.
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      description: Inclusive, Nairobi date.
      schema: { type: string, format: date }

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: rate_limited
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Csv:
      description: CSV file
      content:
        text/csv:
          schema: { type: string }
    AccountResult:
      description: Updated account
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Account' }

  schemas:
    Problem:
      type: object
      required: [status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum:
            - invalid_credentials
            - account_pending
            - account_disabled
            - rate_limited
            - token_expired
            - forbidden
            - not_found
            - code_not_found
            - validation_failed
            - profile_version_conflict
            - client_has_orders
            - due_date_past
            - ease_out_of_range
            - study_mode_off
            - reading_locked
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
        server_version: { type: integer }
        retry_after_s: { type: integer }

    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }

    ClientCode:
      type: string
      pattern: '^[A-Z]{2}[0-9]{4}$'
      examples: [AB1234]
    ParticipantCode:
      type: string
      pattern: '^P[0-9]{3}$'
      examples: [P001]
    SiteCode:
      type: string
      enum: [stature, shoulder, chest, waist, hip, sleeve, outleg, inleg, neck]
    Flag:
      type: string
      enum: [pass, check, fail]
    FlagReason:
      type: string
      enum:
        - scale_disagree
        - level_unchecked
        - loose_clothing
        - landmark_low
        - mask_gap
        - out_of_range
        - crotch_not_found
        - marker_weak
        - waist_level_mismatch
        - view_failed
    CheckState:
      type: string
      enum: [pass, fail, skipped]
    SyncStatus:
      type: string
      enum: [pending, synced, conflict, rejected]
    Sex:
      type: string
      enum: [female, male, unspecified]
    ClothingFit:
      type: string
      enum: [fitted, loose]
    GarmentType:
      type: string
      enum: [shirt, dress, trousers, suit_jacket, skirt, other]
    OrderStatus:
      type: string
      enum: [new, cutting, fitting, ready, collected]
    Role:
      type: string
      enum: [tailor, admin, measurer]
    AccountStatus:
      type: string
      enum: [pending, active, disabled, rejected]
    UnitPref:
      type: string
      enum: [cm, in]
    Locale:
      type: string
      enum: [en, sw]
    ShareVia:
      type: string
      enum: [whatsapp_share, wa_link, download, print]
    AuditAction:
      type: string
      enum:
        - login
        - profile_view
        - export
        - share
        - override
        - deletion
        - status_change
        - code_issue
        - approve
        - settings_change
    AgeBand:
      type: string
      enum: ['18-24', '25-34', '35-44', '45-54', '55+']

    PublicSettings:
      type: object
      required: [study_mode, consent_version, min_app_version]
      properties:
        study_mode: { type: boolean }
        consent_version: { type: string, examples: ['1.0'] }
        min_app_version: { type: string }

    ClientCodeCheck:
      type: object
      required: [valid, tailor_business_name, height_mm]
      properties:
        valid: { type: boolean, const: true }
        tailor_business_name: { type: string }
        height_mm: { type: [integer, 'null'], description: '[CONFIRM] returning height' }

    Landmark:
      type: object
      description: Normalised 0..1 image coordinates.
      required: [x, y, z, visibility]
      properties:
        x: { type: number }
        y: { type: number }
        z: { type: number }
        visibility: { type: number, minimum: 0, maximum: 1 }

    MarkerObs:
      type: object
      required: [corners, image_w, image_h, side_px, confidence]
      properties:
        corners:
          type: array
          description: Four [x, y] pixel corners in the scale image.
          items:
            type: array
            prefixItems:
              - { type: number }
              - { type: number }
            minItems: 2
            maxItems: 2
        image_w: { type: integer }
        image_h: { type: integer }
        side_px: { type: number }
        confidence: { type: number, minimum: 0, maximum: 1 }

    ViewChecks:
      type: object
      required: [level, frame, distance, symmetry, arms, marker, light, sharpness]
      properties:
        level: { $ref: '#/components/schemas/CheckState' }
        frame: { $ref: '#/components/schemas/CheckState' }
        distance: { $ref: '#/components/schemas/CheckState' }
        symmetry: { $ref: '#/components/schemas/CheckState' }
        arms: { $ref: '#/components/schemas/CheckState' }
        marker: { $ref: '#/components/schemas/CheckState' }
        light: { $ref: '#/components/schemas/CheckState' }
        sharpness: { $ref: '#/components/schemas/CheckState' }

    StudyBlock:
      type: object
      description: C6 study covariates.
      required: [participant_code, set_no, lighting, distance_m, clothing_fit_observed]
      properties:
        participant_code: { $ref: '#/components/schemas/ParticipantCode' }
        set_no: { type: integer, enum: [1, 2, 3] }
        lighting: { type: string, enum: [window, lamp, outdoor] }
        distance_m: { type: number, minimum: 1.5, maximum: 3.5 }
        clothing_fit_observed: { $ref: '#/components/schemas/ClothingFit' }
        lux: { type: number, minimum: 0 }

    CaptureSession:
      type: object
      required:
        - session_id
        - started_at
        - capture_mode
        - device_model
        - os
        - browser
        - memory_gb
        - model_variant
        - stream_w
        - stream_h
        - still_source
        - level_unchecked
        - capture_fallback
        - front_checks
        - side_checks
        - scale_front_mm_px
        - scale_side_mm_px
        - scale_stature_mm_px
        - scale_disagreement_pct
        - processing_ms
        - retake_count
        - config_hash
      properties:
        session_id: { type: string, format: uuid }
        started_at: { type: string, format: date-time }
        capture_mode: { type: string, enum: [self, assisted] }
        device_model: { type: string }
        os: { type: string }
        browser: { type: string }
        memory_gb: { type: [number, 'null'] }
        model_variant: { type: string, enum: [lite, full, heavy] }
        stream_w: { type: integer }
        stream_h: { type: integer }
        still_source: { type: string, enum: [imagecapture, canvas, file] }
        level_unchecked: { type: boolean }
        capture_fallback: { type: boolean }
        front_checks: { $ref: '#/components/schemas/ViewChecks' }
        side_checks: { $ref: '#/components/schemas/ViewChecks' }
        scale_front_mm_px: { type: number }
        scale_side_mm_px: { type: number }
        scale_stature_mm_px: { type: number }
        scale_disagreement_pct: { type: number }
        processing_ms: { type: integer }
        retake_count: { type: integer, minimum: 0 }
        config_hash: { type: string }
        study: { $ref: '#/components/schemas/StudyBlock' }

    Measurement:
      type: object
      required: [site_code, value_mm, method, confidence_flag, flag_reasons]
      properties:
        site_code: { $ref: '#/components/schemas/SiteCode' }
        value_mm:
          type: [integer, 'null']
          description: C4 - null when confidence_flag is fail.
        method: { type: string, enum: [auto, override] }
        confidence_flag: { $ref: '#/components/schemas/Flag' }
        flag_reasons:
          type: array
          items: { $ref: '#/components/schemas/FlagReason' }
        correction_factor: { type: number }
        level_fraction: { type: number }
        half_width_mm: { type: number }
        half_depth_mm: { type: number }

    ConsentRecord:
      type: object
      required: [consent_version, language, scope, given_at]
      properties:
        consent_version: { type: string, examples: ['1.0', 'study-paper-1.0'] }
        language: { $ref: '#/components/schemas/Locale' }
        scope:
          type: array
          items: { type: string, enum: [measure, measurements_only, retention, study_paper] }
        given_at: { type: string, format: date-time }
        withdrawn_at: { type: string, format: date-time }

    MeasurementProfilePayload:
      type: object
      required:
        - profile_id
        - client_code
        - version
        - captured_at
        - status
        - rules_version
        - covariates
        - consent
        - session
        - landmarks_front
        - landmarks_side
        - marker_front
        - marker_side
        - measurements
      properties:
        profile_id: { type: string, format: uuid }
        client_code: { $ref: '#/components/schemas/ClientCode' }
        version: { type: integer, minimum: 1 }
        captured_at: { type: string, format: date-time }
        status: { type: string, const: final }
        rules_version: { type: string, examples: ['0.1-uncalibrated'] }
        covariates:
          type: object
          required: [height_mm_entered, sex, clothing_fit, code_verified]
          properties:
            height_mm_entered: { type: integer, minimum: 1200, maximum: 2200 }
            sex: { $ref: '#/components/schemas/Sex' }
            clothing_fit: { $ref: '#/components/schemas/ClothingFit' }
            code_verified: { type: boolean }
        consent: { $ref: '#/components/schemas/ConsentRecord' }
        session: { $ref: '#/components/schemas/CaptureSession' }
        landmarks_front:
          type: array
          minItems: 33
          maxItems: 33
          items: { $ref: '#/components/schemas/Landmark' }
        landmarks_side:
          type: array
          minItems: 33
          maxItems: 33
          items: { $ref: '#/components/schemas/Landmark' }
        marker_front: { $ref: '#/components/schemas/MarkerObs' }
        marker_side: { $ref: '#/components/schemas/MarkerObs' }
        measurements:
          type: array
          description: 9 rows including the stature check.
          items: { $ref: '#/components/schemas/Measurement' }

    MeasurementProfile:
      allOf:
        - $ref: '#/components/schemas/MeasurementProfilePayload'
        - type: object
          required: [sync_status]
          properties:
            client_id: { type: string, format: uuid }
            sync_status: { $ref: '#/components/schemas/SyncStatus' }
            created_at: { type: string, format: date-time }

    SessionUser:
      type: object
      required: [user_id, email, role, status, locale]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        locale: { $ref: '#/components/schemas/Locale' }
        measurer_code: { type: string }

    LoginResponse:
      type: object
      required: [access_token, expires_at, user]
      properties:
        access_token: { type: string }
        expires_at: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/SessionUser' }

    RegisterInput:
      type: object
      required: [email, password, business_name, phone, area, locale]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10 }
        business_name: { type: string, minLength: 1 }
        phone: { type: string, pattern: '^\+2547[0-9]{8}$|^\+2541[0-9]{8}$' }
        area: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }

    EasePresets:
      type: object
      description: Ease in mm per garment, then per site.
      additionalProperties:
        type: object
        propertyNames: { $ref: '#/components/schemas/SiteCode' }
        additionalProperties: { type: integer, minimum: 0, maximum: 300 }

    Me:
      allOf:
        - $ref: '#/components/schemas/SessionUser'
        - type: object
          required: [unit_pref, include_name_default, ease_presets]
          properties:
            business_name: { type: string }
            phone: { type: string }
            area: { type: string }
            unit_pref: { $ref: '#/components/schemas/UnitPref' }
            include_name_default: { type: boolean }
            ease_presets: { $ref: '#/components/schemas/EasePresets' }

    MePatch:
      type: object
      properties:
        business_name: { type: string }
        phone: { type: string }
        area: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }
        unit_pref: { $ref: '#/components/schemas/UnitPref' }
        include_name_default: { type: boolean }
        ease_presets: { $ref: '#/components/schemas/EasePresets' }

    FlagSummary:
      type: object
      required: [pass, check, fail]
      properties:
        pass: { type: integer, minimum: 0 }
        check: { type: integer, minimum: 0 }
        fail: { type: integer, minimum: 0 }

    ClientSummary:
      type: object
      required:
        - client_id
        - client_code
        - display_name
        - height_mm
        - created_at
        - last_capture_at
        - latest_profile_id
        - latest_sync_status
        - flags
        - open_orders
        - has_new
      properties:
        client_id: { type: string, format: uuid }
        client_code: { $ref: '#/components/schemas/ClientCode' }
        display_name: { type: [string, 'null'] }
        height_mm: { type: [integer, 'null'] }
        created_at: { type: string, format: date-time }
        last_capture_at: { type: [string, 'null'], format: date-time }
        latest_profile_id: { type: [string, 'null'], format: uuid }
        latest_sync_status:
          oneOf:
            - { $ref: '#/components/schemas/SyncStatus' }
            - { type: 'null' }
        flags:
          oneOf:
            - { $ref: '#/components/schemas/FlagSummary' }
            - { type: 'null' }
        open_orders: { type: integer, minimum: 0 }
        has_new: { type: boolean }

    ProfileSummary:
      type: object
      required: [profile_id, version, captured_at, capture_mode, flags, sync_status, has_conflict]
      properties:
        profile_id: { type: string, format: uuid }
        version: { type: integer }
        captured_at: { type: string, format: date-time }
        capture_mode: { type: string, enum: [self, assisted] }
        flags: { $ref: '#/components/schemas/FlagSummary' }
        sync_status: { $ref: '#/components/schemas/SyncStatus' }
        has_conflict: { type: boolean }

    ClientDetail:
      allOf:
        - $ref: '#/components/schemas/ClientSummary'
        - type: object
          required: [deep_link, profiles, orders]
          properties:
            deep_link: { type: string, format: uri }
            profiles:
              type: array
              items: { $ref: '#/components/schemas/ProfileSummary' }
            orders:
              type: array
              items: { $ref: '#/components/schemas/OrderSummary' }

    IssueCodeInput:
      type: object
      properties:
        display_name: { type: string }
        height_mm: { type: integer, minimum: 1200, maximum: 2200 }

    IssueCodeResponse:
      type: object
      required: [client_id, client_code, deep_link]
      properties:
        client_id: { type: string, format: uuid }
        client_code: { $ref: '#/components/schemas/ClientCode' }
        deep_link: { type: string, format: uri }

    ConflictPair:
      type: object
      required: [profile_id, client_id, client_code, server, device]
      properties:
        profile_id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        client_code: { $ref: '#/components/schemas/ClientCode' }
        display_name: { type: string }
        server: { $ref: '#/components/schemas/MeasurementProfile' }
        device: { $ref: '#/components/schemas/MeasurementProfile' }

    OrderItemInput:
      type: object
      required: [site_code, body_mm, ease_mm, overridden]
      properties:
        site_code: { $ref: '#/components/schemas/SiteCode' }
        body_mm: { type: [integer, 'null'] }
        ease_mm: { type: integer, minimum: 0, maximum: 300 }
        overridden: { type: boolean }
        override_reason: { type: string }
        flag_confirmed: { type: boolean }
        pending_fitting: { type: boolean, description: '[CONFIRM backend support]' }

    OrderItem:
      allOf:
        - $ref: '#/components/schemas/OrderItemInput'
        - type: object
          required: [finished_mm, confidence_flag]
          properties:
            finished_mm: { type: [integer, 'null'] }
            confidence_flag: { $ref: '#/components/schemas/Flag' }

    Order:
      type: object
      required:
        - order_id
        - order_no
        - client_id
        - client_code
        - profile_id
        - profile_version
        - garment_type
        - status
        - due_date
        - notes
        - items
        - created_at
        - updated_at
        - status_history
      properties:
        order_id: { type: string, format: uuid }
        order_no: { type: string, examples: [ORD-0231] }
        client_id: { type: string, format: uuid }
        client_code: { $ref: '#/components/schemas/ClientCode' }
        display_name: { type: string }
        profile_id: { type: string, format: uuid }
        profile_version: { type: integer }
        garment_type: { $ref: '#/components/schemas/GarmentType' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        due_date: { type: string, format: date }
        notes: { type: string, maxLength: 1000 }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        status_history:
          type: array
          items:
            type: object
            required: [status, at]
            properties:
              status: { $ref: '#/components/schemas/OrderStatus' }
              at: { type: string, format: date-time }

    OrderSummary:
      type: object
      required:
        - order_id
        - order_no
        - client_id
        - client_code
        - profile_id
        - profile_version
        - garment_type
        - status
        - due_date
        - created_at
        - flagged_sites
        - has_conflict
      properties:
        order_id: { type: string, format: uuid }
        order_no: { type: string }
        client_id: { type: string, format: uuid }
        client_code: { $ref: '#/components/schemas/ClientCode' }
        display_name: { type: string }
        profile_id: { type: string, format: uuid }
        profile_version: { type: integer }
        garment_type: { $ref: '#/components/schemas/GarmentType' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        due_date: { type: string, format: date }
        created_at: { type: string, format: date-time }
        flagged_sites: { type: integer, minimum: 0 }
        has_conflict: { type: boolean }

    OrderCreateInput:
      type: object
      required: [client_id, profile_id, garment_type, due_date, notes, items]
      properties:
        client_id: { type: string, format: uuid }
        profile_id: { type: string, format: uuid }
        garment_type: { $ref: '#/components/schemas/GarmentType' }
        due_date: { type: string, format: date }
        notes: { type: string, maxLength: 1000 }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItemInput' }

    OrderPatch:
      type: object
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        due_date: { type: string, format: date }
        notes: { type: string, maxLength: 1000 }
        items:
          type: array
          description: Full replacement.
          items: { $ref: '#/components/schemas/OrderItemInput' }

    SheetResponse:
      type: object
      required: [sheet_id, png_url, pdf_url, share_text, generated_at]
      properties:
        sheet_id: { type: string, format: uuid }
        png_url: { type: string }
        pdf_url: { type: string }
        share_text: { type: string }
        generated_at: { type: string, format: date-time }

    AuditEntry:
      type: object
      required: [log_id, occurred_at, user_email, role, action, entity_type, entity_id, summary]
      properties:
        log_id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        user_email: { type: string }
        role: { type: string }
        action: { $ref: '#/components/schemas/AuditAction' }
        entity_type: { type: string }
        entity_id: { type: string }
        summary: { type: string }

    Account:
      type: object
      required: [user_id, email, role, status, registered_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        business_name: { type: string }
        phone: { type: string }
        area: { type: string }
        registered_at: { type: string, format: date-time }
        measurer_code: { type: string }
        trained_on: { type: string, format: date }
        reject_reason: { type: string }

    MeasurerInput:
      type: object
      required: [email, password, measurer_code, trained_on]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10 }
        measurer_code: { type: string, pattern: '^[A-Z]{1,2}$' }
        trained_on: { type: string, format: date }

    AdminSettings:
      type: object
      required: [retention_months, study_mode]
      properties:
        retention_months: { type: integer, minimum: 1, maximum: 120, default: 24 }
        study_mode: { type: boolean }

    DeletionRequest:
      type: object
      required: [request_id, client_code, profile_ids, reason, received_at, status]
      properties:
        request_id: { type: string, format: uuid }
        client_code: { $ref: '#/components/schemas/ClientCode' }
        profile_ids:
          type: array
          items: { type: string, format: uuid }
        reason: { type: string, enum: [delete, withdraw_consent] }
        received_at: { type: string, format: date-time }
        status: { type: string, enum: [received, completed, rejected] }
        completed_at: { type: string, format: date-time }

    ParticipantInput:
      type: object
      required: [participant_code, sex, age_band, venue]
      properties:
        participant_code: { $ref: '#/components/schemas/ParticipantCode' }
        sex: { type: string, enum: [female, male] }
        age_band: { $ref: '#/components/schemas/AgeBand' }
        venue: { type: string }

    Participant:
      allOf:
        - $ref: '#/components/schemas/ParticipantInput'
        - type: object
          required: [participant_id, client_code, enrolled_at, sets_captured, readings]
          properties:
            participant_id: { type: string, format: uuid }
            client_code: { $ref: '#/components/schemas/ClientCode' }
            enrolled_at: { type: string, format: date-time }
            sets_captured: { type: integer, minimum: 0, maximum: 3 }
            readings:
              type: object
              description: Readings entered per site (0-4).
              propertyNames: { $ref: '#/components/schemas/SiteCode' }
              additionalProperties: { type: integer, minimum: 0, maximum: 4 }

    ReferenceReadingInput:
      type: object
      required: [participant_code, reading_no, values, taken_at]
      properties:
        participant_code: { $ref: '#/components/schemas/ParticipantCode' }
        reading_no: { type: integer, enum: [1, 2] }
        values:
          type: object
          description: Millimetres per site.
          propertyNames: { $ref: '#/components/schemas/SiteCode' }
          additionalProperties: { type: integer, minimum: 0 }
        taken_at: { type: string, format: date-time }

    ReferenceReadingResult:
      type: object
      required: [reading_id, participant_code, reading_no, measurer_code, locked, out_of_order]
      properties:
        reading_id: { type: string, format: uuid }
        participant_code: { $ref: '#/components/schemas/ParticipantCode' }
        reading_no: { type: integer, enum: [1, 2] }
        measurer_code: { type: string }
        locked: { type: boolean, const: true }
        out_of_order: { type: boolean }
