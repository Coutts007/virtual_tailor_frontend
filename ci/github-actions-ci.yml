name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Vision assets (pinned model download, worker bundles)
        run: npm run vendor
      - name: Lint (Prettier + ESLint)
        run: npm run lint
      - name: Typecheck (svelte-check)
        run: npm run check
      - name: Unit tests (Vitest, incl. API contract and i18n checks)
        run: npm run test:unit
      - name: Measurement module coverage ≥ 90% (NFR-13)
        run: npm run test:coverage
      - name: Licence check (NFR-14)
        run: npm run licenses
      - name: Dependency audit with allowlist (Section 19)
        run: npm run audit
      - name: Build (+ security headers)
        run: npm run build
      - name: Bundle budgets (Section 18)
        run: npm run budget
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build
          retention-days: 3

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - run: npx playwright install --with-deps chromium
      - name: End-to-end (phone, desktop, real-camera; axe on every route)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  production:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build
      - run: npm run vendor
      - run: npx playwright install --with-deps chromium
      - name: Production build checks (CSP, offline shell, SW cache rules, workers under CSP)
        run: npm run test:prod
      - name: Lighthouse CI (TTI ≤ 3.5 s on mobile, accessibility ≥ 0.95)
        run: npx -y @lhci/cli@0.14.0 autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report
          retention-days: 7
