name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Lint (Prettier + ESLint)
        run: npm run lint
      - name: Typecheck (svelte-check)
        run: npm run check
      - name: Unit tests (Vitest)
        run: npm run test:unit
      - name: Measurement module coverage ≥ 90% (NFR-13)
        run: npm run test:coverage
      - name: Licence check (NFR-14)
        run: npm run licenses
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Vision assets (pinned model download)
        run: npm run vendor
      - run: npx playwright install --with-deps chromium
      - name: End-to-end smoke (Playwright + axe)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
