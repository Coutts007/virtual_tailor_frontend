<text x="15" y="16" font-family="Helvetica, Arial, sans-serif" font-size="5.291666666666667" font-weight="700" >Virtual Tailor measuring sheet — hold flat, square facing camera</text>
<text x="15" y="24" font-family="Helvetica, Arial, sans-serif" font-size="3.5277777777777777"  >Karatasi ya kupimia ya Virtual Tailor — ishike sawasawa, mraba utazame kamera</text>
<text x="15" y="30" font-family="Helvetica, Arial, sans-serif" font-size="3.175"  >Print at 100% / Actual size (not "Fit to page"). Do not fold through the black square. Keep your fingers off it.</text>
<text x="15" y="217" font-family="Helvetica, Arial, sans-serif" font-size="3.175"  >Check: this line must be exactly 10 cm. / Kagua: mstari huu lazima uwe sentimita 10 kamili.</text>
<text x="105" y="261" font-family="Helvetica, Arial, sans-serif" font-size="3.175"  text-anchor="middle">A bank card should fit exactly in this box.</text>
<text x="105" y="267" font-family="Helvetica, Arial, sans-serif" font-size="3.175"  text-anchor="middle">Kadi ya benki inapaswa kutosha sawasawa hapa.</text>
<text x="15" y="293" font-family="Helvetica, Arial, sans-serif" font-size="2.469444444444444"  >ArUco DICT_4X4_50 id 0 · 150 mm · No photo ever leaves your phone.</text>
